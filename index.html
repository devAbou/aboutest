<!DOCTYPE html>  <html lang="pt-BR">  
<head>  <link rel="manifest" href="manifest.json">  
<meta name="theme-color" content="#000000">  <meta charset="UTF-8">  
<title>Scanner de Código de Barras</title>  
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>  <style>  
  
body{  
font-family:Arial;  
background:#f4f4f4;  
padding:10px;  
}  
  
h2{  
text-align:center;  
}  
  
#camera{  
display:none;  
width:100%;  
max-width:500px;  
height:350px;  
margin:auto;  
background:black;  
border-radius:8px;  
overflow:hidden;  
}  
  
button,input{  
width:100%;  
padding:12px;  
font-size:16px;  
margin-top:8px;  
}  
  
#lista,#barcodes,#calcHoras{  
background:#fff;  
padding:10px;  
margin-top:10px;  
border-radius:6px;  
}  
  
.codigo{  
display:flex;  
justify-content:space-between;  
padding:6px;  
border-bottom:1px solid #ddd;  
}  
  
.remover{  
background:red;  
color:white;  
border:none;  
border-radius:50%;  
width:24px;  
height:24px;  
cursor:pointer;  
}  
  
svg{  
margin-bottom:15px;  
}  
  
#resultadoHoras{  
margin-top:10px;  
font-weight:bold;  
}  
  
</style>  </head>  <script>  
if ("serviceWorker" in navigator){  
navigator.serviceWorker.register("sw.js")  
}  
</script>  <body>  <h2>📷 Scanner de Código de Barras</h2>  <div style="display:flex;gap:5px;">  
<input id="inputCodigo" placeholder="Digite qualquer código">  
<textarea id="luaTabela"
placeholder="Cole aqui uma tabela Lua com EANs"
style="width:100%;height:120px;margin-top:10px;"></textarea>

<button onclick="importarTabelaLua()">
Adicionar tabela Lua
</button>
    
<button onclick="adicionarCodigoManual()">Adicionar</button>  
</div>  <button id="btnCamera">Abrir câmera</button> <button id="btnFlash">Ligar flash</button>
<input type="file" id="imagemEAN" accept="image/*">

<button onclick="importarEANsDaImagem()">
Importar EANs da imagem
</button>
<div id="camera"></div>  <button onclick="gerarImagens()">Gerar imagens</button> <button onclick="limparLista()">Limpar lista</button>

<div id="lista">  
<h3>Códigos:</h3>  
<div id="codigos"></div>  
</div>  <div id="barcodes">  
<h3>Imagens:</h3>  
</div>  <script>  
  
/* =========================  
SCANNER  
========================= */  
  
let codigos=[]  
let scannerAtivo=false  
let usandoQuagga=false  
let detector=null  
let stream=null  
let track=null  
let scanInterval=null  
let flashAtivo=false  
  
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)  
  
function ean13Valido(c){  
  
if(!/^\d{13}$/.test(c))return false  
  
let soma=0  
  
for(let i=0;i<12;i++){  
soma+=(i%2===0)?+c[i]:+c[i]*3  
}  
  
return(10-(soma%10))%10===+c[12]  
  
}  
  
function adicionarCodigo(c){  
  
if(!c||codigos.includes(c))return false  
  
codigos.push(c)  
  
atualizarLista()  
  
return true  
  
}  
  function importarTabelaLua(){

    const texto = document.getElementById("luaTabela").value;

    // procura qualquer sequência de 13 dígitos
    const encontrados = texto.match(/\d{13}/g);

    if(!encontrados){
        alert("Nenhum EAN-13 encontrado.");
        return;
    }

    let adicionados = 0;

    encontrados.forEach(codigo=>{

        if(adicionarCodigo(codigo)){
            adicionados++;
        }

    });

    atualizarLista();

    alert(
        adicionados +
        " código(s) adicionado(s)."
    );

        }
function adicionarCodigoManual(){  
  
const input=document.getElementById("inputCodigo")  
  
if(adicionarCodigo(input.value.trim()))input.value=""  
  
}  

async function importarEANsDaImagem(){

    const arquivo =
        document.getElementById("imagemEAN").files[0];

    if(!arquivo){
        alert("Selecione uma imagem.");
        return;
    }

    document.body.style.cursor = "wait";

    try{

        const resultado =
            await Tesseract.recognize(
                arquivo,
                "eng"
            );

        const texto =
            resultado.data.text;

        console.log(texto);

        // Procura todos os números com 13 dígitos
        const eans =
            texto.match(/\b\d{13}\b/g) || [];

        let adicionados = 0;

        eans.forEach(ean=>{

            if(adicionarCodigo(ean)){
                adicionados++;
            }

        });

        atualizarLista();

        alert(
            adicionados +
            " EAN(s) encontrado(s)"
        );

    }catch(err){

        console.error(err);

        alert(
            "Erro ao processar imagem"
        );

    }

    document.body.style.cursor = "default";

}
  
function atualizarLista(){  
  
const div=document.getElementById("codigos")  
  
div.innerHTML=""  
  
codigos.forEach((c,i)=>{  
  
div.innerHTML+=`  
<div class="codigo">  
<span>${c}</span>  
<button class="remover" onclick="removerCodigo(${i})">×</button>  
</div>`  
  
})  
  
}  
  
function removerCodigo(i){  
  
codigos.splice(i,1)  
  
atualizarLista()  
  
}  
  
function gerarImagens(){  
  
const div=document.getElementById("barcodes")  
  
div.innerHTML="<h3>Imagens:</h3>"  
  
codigos.forEach(codigo=>{  
  
const svg=document.createElementNS("http://www.w3.org/2000/svg","svg")  
  
div.appendChild(svg)  
  
JsBarcode(svg,codigo,{  
format:ean13Valido(codigo)?"ean13":"code128",  
width:2,  
height:80,  
displayValue:true  
})  
  
})  
  
}  
  
function limparLista(){  
  
codigos=[]  
  
atualizarLista()  
  
document.getElementById("barcodes").innerHTML="<h3>Imagens:</h3>"  
  
}  
  
function iniciarScanner(){  
  
if(scannerAtivo)return  
  
scannerAtivo=true  
  
document.getElementById("camera").style.display="block"  
  
document.getElementById("btnCamera").textContent="Fechar câmera"  
  
if(isIOS)iniciarQuagga()  
else iniciarBarcodeDetector()  
  
}  
  
function pararScanner(){  
  
scannerAtivo=false  
  
document.getElementById("camera").style.display="none"  
  
document.getElementById("btnCamera").textContent="Abrir câmera"  
  
if(usandoQuagga){  
Quagga.stop()  
usandoQuagga=false  
}  
  
if(scanInterval)clearInterval(scanInterval)  
  
if(stream){  
stream.getTracks().forEach(t=>t.stop())  
stream=null  
}  
  
}  
  
async function iniciarBarcodeDetector(){  
  
if(!("BarcodeDetector" in window)){  
alert("BarcodeDetector não suportado")  
pararScanner()  
return  
}  
  
const camera=document.getElementById("camera")  
  
camera.innerHTML=""  
  
detector=new BarcodeDetector({formats:["ean_13","code_128"]})  
  
stream=await navigator.mediaDevices.getUserMedia({  
video:{facingMode:"environment"}  
})  
  
const video=document.createElement("video")  
  
video.srcObject=stream  
video.autoplay=true  
video.muted=true  
video.playsInline=true  
  
camera.appendChild(video)  
  
await video.play()  
  
track=stream.getVideoTracks()[0]  
  
scanInterval=setInterval(async()=>{  
  
const codes=await detector.detect(video)  
  
for(const c of codes){  
  
if(adicionarCodigo(c.rawValue)){  
pararScanner()  
return  
}  
  
}  
  
},600)  
  
}  
  
function iniciarQuagga(){  
  
usandoQuagga=true  
  
Quagga.init({  
  
inputStream:{  
type:"LiveStream",  
target:document.querySelector("#camera"),  
constraints:{facingMode:"environment"}  
},  
  
decoder:{  
readers:["ean_reader","code_128_reader"]  
}  
  
},err=>{  
  
if(err){  
alert("Erro ao iniciar câmera")  
pararScanner()  
return  
}  
  
Quagga.start()  
  
})  
  
Quagga.onDetected(data=>{  
  
if(adicionarCodigo(data.codeResult.code)){  
pararScanner()  
}  
  
})  
  
}  
  
async function toggleFlash(){  
  
if(!track)return alert("Flash não suportado")  
  
flashAtivo=!flashAtivo  
  
try{  
  
await track.applyConstraints({  
advanced:[{torch:flashAtivo}]  
})  
  
document.getElementById("btnFlash").textContent=  
flashAtivo?"Desligar flash":"Ligar flash"  
  
}catch{  
  
alert("Flash indisponível")  
  
flashAtivo=false  
  
}  
  
}  
  
document.getElementById("btnCamera").onclick=  
()=>scannerAtivo?pararScanner():iniciarScanner()  
  
document.getElementById("btnFlash").onclick=toggleFlash  
  
</script>  </body>  
</html>
