<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta charset="UTF-8">
<title>Scanner de Código de Barras</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- QuaggaJS (iOS) -->
<script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

<!-- JsBarcode -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 10px;
}
h2 { text-align: center; }

<div id="calcHoras" style="background:#fff;padding:10px;border-radius:6px;margin-bottom:10px;">
<h3>⏱ Calcular horário de saída</h3>

<input id="entrada" placeholder="Entrada (ex: 13:24)">
<input id="saidaIntervalo" placeholder="Saída para intervalo (ex: 16:10)">

<button onclick="calcularHoras()">Calcular</button>

<div id="resultadoHoras" style="margin-top:10px;font-weight:bold;"></div>
</div>

#camera {
    display: none;
    width: 100%;
    max-width: 500px;
    height: 350px;
    margin: auto;
    background: black;
    border-radius: 8px;
    overflow: hidden;
}

button, input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
}

#lista, #barcodes {
    background: #fff;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
}

.codigo {
    display: flex;
    justify-content: space-between;
    padding: 6px;
    border-bottom: 1px solid #ddd;
}

.remover {
    background: red;
    color: white;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    cursor: pointer;
}

svg { margin-bottom: 15px; }
</style>
</head>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

<body>

<h2>📷 Scanner de Código de Barras</h2>

<div style="display:flex; gap:5px;">
    <input id="inputCodigo" placeholder="Digite qualquer código">
    <button onclick="adicionarCodigoManual()">Adicionar</button>
</div>

<button id="btnCamera">Abrir câmera</button>
<button id="btnFlash">Ligar flash</button>

<div id="camera"></div>

<button onclick="gerarImagens()">Gerar imagens</button>
<button onclick="limparLista()">Limpar lista</button>

<div id="lista">
    <h3>Códigos:</h3>
    <div id="codigos"></div>
</div>

<div id="barcodes">
    <h3>Imagens:</h3>
</div>

<script>
/* =========================
   VARIÁVEIS
========================= */
let codigos = [];
let scannerAtivo = false;
let usandoQuagga = false;
let detector = null;
let stream = null;
let track = null;
let scanInterval = null;
let flashAtivo = false;

/* =========================
   DETECTAR iOS
========================= */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

/* =========================
   EAN-13 REAL
========================= */
function ean13Valido(codigo) {
    if (!/^\d{13}$/.test(codigo)) return false;

    let soma = 0;
    for (let i = 0; i < 12; i++) {
        soma += (i % 2 === 0) ? +codigo[i] : +codigo[i] * 3;
    }
    return (10 - (soma % 10)) % 10 === +codigo[12];
}

/* =========================
   LISTA
========================= */
function adicionarCodigo(codigo) {
    if (!codigo || codigos.includes(codigo)) return false;
    codigos.push(codigo);
    atualizarLista();
    return true;
}

function adicionarCodigoManual() {
    const input = document.getElementById("inputCodigo");
    if (adicionarCodigo(input.value.trim())) input.value = "";
}

function atualizarLista() {
    const div = document.getElementById("codigos");
    div.innerHTML = "";

    codigos.forEach((c, i) => {
        div.innerHTML += `
        <div class="codigo">
            <span>${c}</span>
            <button class="remover" onclick="removerCodigo(${i})">×</button>
        </div>`;
    });
}

function removerCodigo(i) {
    codigos.splice(i, 1);
    atualizarLista();
}

/* =========================
   GERAR IMAGENS
========================= */
function gerarImagens() {
    const div = document.getElementById("barcodes");
    div.innerHTML = "<h3>Imagens:</h3>";

    codigos.forEach(codigo => {
        const svg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );
        div.appendChild(svg);

        JsBarcode(svg, codigo, {
            format: ean13Valido(codigo) ? "ean13" : "code128",
            width: 2,
            height: 80,
            displayValue: true
        });
    });
}

/* =========================
   LIMPAR
========================= */
function limparLista() {
    codigos = [];
    atualizarLista();
    document.getElementById("barcodes").innerHTML = "<h3>Imagens:</h3>";
}

/* =========================
   SCANNER
========================= */
function iniciarScanner() {
    if (scannerAtivo) return;

    scannerAtivo = true;
    document.getElementById("camera").style.display = "block";
    document.getElementById("btnCamera").textContent = "Fechar câmera";

    if (isIOS) iniciarQuagga();
    else iniciarBarcodeDetector();
}

function pararScanner() {
    scannerAtivo = false;
    document.getElementById("camera").style.display = "none";
    document.getElementById("btnCamera").textContent = "Abrir câmera";

    if (usandoQuagga) {
        Quagga.stop();
        usandoQuagga = false;
    }

    if (scanInterval) clearInterval(scanInterval);

    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

/* =========================
   ANDROID → BarcodeDetector
========================= */
async function iniciarBarcodeDetector() {
    if (!("BarcodeDetector" in window)) {
        alert("BarcodeDetector não suportado");
        pararScanner();
        return;
    }

    const camera = document.getElementById("camera");
    camera.innerHTML = "";

    detector = new BarcodeDetector({ formats: ["ean_13", "code_128"] });

    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
    });

    const video = document.createElement("video");
    video.srcObject = stream;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    camera.appendChild(video);
    await video.play();

    track = stream.getVideoTracks()[0];

    scanInterval = setInterval(async () => {
        const codes = await detector.detect(video);
        for (const c of codes) {
            if (adicionarCodigo(c.rawValue)) {
                pararScanner();
                return;
            }
        }
    }, 600);
}

/* =========================
   iOS → QuaggaJS
========================= */
function iniciarQuagga() {
    usandoQuagga = true;

    Quagga.init({
        inputStream: {
            type: "LiveStream",
            target: document.querySelector("#camera"),
            constraints: { facingMode: "environment" }
        },
        decoder: {
            readers: ["ean_reader", "code_128_reader"]
        }
    }, err => {
        if (err) {
            alert("Erro ao iniciar câmera");
            pararScanner();
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected(data => {
        if (adicionarCodigo(data.codeResult.code)) {
            pararScanner();
        }
    });
}

/* =========================
   FLASH
========================= */
async function toggleFlash() {
    if (!track) return alert("Flash não suportado");

    flashAtivo = !flashAtivo;
    try {
        await track.applyConstraints({
            advanced: [{ torch: flashAtivo }]
        });
        document.getElementById("btnFlash").textContent =
            flashAtivo ? "Desligar flash" : "Ligar flash";
    } catch {
        alert("Flash indisponível");
        flashAtivo = false;
    }
}

    /* =========================
CALCULO DE HORAS AVANÇADO
========================= */

function horaParaMinutos(hora) {
if (!hora) return 0
const [h,m] = hora.split(":")
return parseInt(h)*60 + parseInt(m)
}

function minutosParaHora(min) {

```
min = ((min % 1440) + 1440) % 1440

const h = Math.floor(min/60)
const m = min%60

return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")
```

}

function calcularHoras(){

```
const entrada = document.getElementById("entrada").value
const saidaIntervalo = document.getElementById("saidaIntervalo").value
const cargaHorariaInput = document.getElementById("cargaHoraria").value
const duracaoIntervaloInput = document.getElementById("duracaoIntervalo").value

if(!entrada || !saidaIntervalo || !cargaHorariaInput || !duracaoIntervaloInput){
    return
}

const minutosEntrada = horaParaMinutos(entrada)
const minutosSaidaIntervalo = horaParaMinutos(saidaIntervalo)
const cargaHoraria = horaParaMinutos(cargaHorariaInput)
const duracaoIntervalo = horaParaMinutos(duracaoIntervaloInput)

const tempoTrabalhado = minutosSaidaIntervalo - minutosEntrada

const tempoRestante = cargaHoraria - tempoTrabalhado

const retornoIntervalo = minutosSaidaIntervalo + duracaoIntervalo

const novaSaida = retornoIntervalo + tempoRestante

const retorno = minutosParaHora(retornoIntervalo)
const horaSaida = minutosParaHora(novaSaida)

document.getElementById("resultadoHoras").innerHTML =
"🔁 Retorno intervalo: "+retorno+"<br>"+
"🏁 Saída final: "+horaSaida

salvarConfig()
```

}

/* =========================
SALVAR CONFIG
========================= */

function salvarConfig(){

localStorage.setItem("cargaHoraria",document.getElementById("cargaHoraria").value)
localStorage.setItem("duracaoIntervalo",document.getElementById("duracaoIntervalo").value)

}

function carregarConfig(){

const carga = localStorage.getItem("cargaHoraria")
const intervalo = localStorage.getItem("duracaoIntervalo")

if(carga) document.getElementById("cargaHoraria").value = carga
if(intervalo) document.getElementById("duracaoIntervalo").value = intervalo

}

document.querySelectorAll("#calcHoras input").forEach(i=>{
i.addEventListener("input",calcularHoras)
})

carregarConfig()


/* =========================
   BOTÕES
========================= */
document.getElementById("btnCamera").onclick =
    () => scannerAtivo ? pararScanner() : iniciarScanner();

document.getElementById("btnFlash").onclick = toggleFlash;
</script>

</body>
</html>
